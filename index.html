<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFID信息 - 车管系统</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            position: relative;
            overflow: hidden;
        }
        .contentBox {
            width: 100vw;
            max-width: 100%;
            height: 194px;
            padding: 28px;
            box-sizing: border-box;
            border: 0px solid #f8f8f8;
            position: relative;
            z-index: 10;
        }
        .card-box {
            width: 100%;
            height: 159px;
            border: 0px solid #f8f8f8;
            box-sizing: border-box;
        }
        .card-line {
            width: 100%;
            height: 46px;
            padding: 12px 0;
            margin: 0;
            border-bottom: 1px solid #ebedf0;
            box-sizing: border-box;
            font-size: 14px;
        }
        .label, .value {
            display: inline-block;
            vertical-align: middle;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
        }
        .label {
            width: 86px;
            color: #646566;
        }
        .value {
            width: auto;
            color: #000000;
        }
        /* 背景水印样式 */
        .watermark-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            grid-template-rows: repeat(auto-fill, minmax(150px, 1fr));
            gap: 30px; /* 固定间距 */
            z-index: 1;
            pointer-events: none;
            padding-top: 0px; /* 调整距离顶部的距离 */
            padding-left: 40px; /* 调整距离左端的距离 */
            overflow: hidden;
        }
        .watermark {
            display: flex;
            justify-content: start;
            align-items: start;
            width: 200px; /* 固定宽度 */
            height: 150px; /* 固定高度 */
            font-size: 19px; /* 固定字体大小 */
            font-weight: 500;
            color: rgba(0, 0, 0, 0.4);
            transform: rotate(-20deg);
            opacity: 0.5;
            text-align: left;
            white-space: pre-wrap;
            overflow: hidden;


        }
    </style>
</head>
<body>
    <!-- 背景水印容器 -->
    <div class="watermark-container">
        <!-- 通过 JavaScript 动态生成水印元素 -->
    </div>

    <div class="contentBox">
        <div class="card-box">
            <div class="card-line">
                <div class="label">车牌号</div>
                <div class="value">赣AR0F333</div>
            </div>
            <div class="card-line">
                <div class="label">车主姓名</div>
                <div class="value">韩**</div>
            </div>
            <div class="card-line">
                <div class="label">入网时间</div>
                <div class="value">2023-11-10 14:28:09</div>
            </div>
        </div>
    </div>

    <script>
        // 获取当前时间并格式化为 YYYY-MM-DD HH:mm:ss
        const currentDate = new Date();
        const formattedDate = currentDate.getFullYear() + '-' +
            String(currentDate.getMonth() + 1).padStart(2, '0') + '-' +
            String(currentDate.getDate()).padStart(2, '0') + ' ' +
            String(currentDate.getHours()).padStart(2, '0') + ':' +
            String(currentDate.getMinutes()).padStart(2, '0') + ':' +
            String(currentDate.getSeconds()).padStart(2, '0');

        // 将水印时间插入到水印中
        const watermarkText = `赣AR0F333\n${formattedDate}`;

        // 获取水印容器
        const watermarkContainer = document.querySelector('.watermark-container');

        // 计算需要生成的水印数量
        const totalColumns = Math.floor(window.innerWidth / 150); // 150px + 20px gap
        const totalRows = Math.floor(window.innerHeight / 150);  // 150px + 20px gap

        for (let i = 0; i < totalColumns * totalRows; i++) {
            const watermark = document.createElement('div');
            watermark.classList.add('watermark');
            watermark.textContent = watermarkText;
            watermarkContainer.appendChild(watermark);
        }
    </script>
</body>
</html>
